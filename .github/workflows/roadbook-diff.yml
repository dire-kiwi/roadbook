# An example GitHub Actions workflow: on every pull request, draw what changed in the charts
# and post a summary with a link to the pages. Copy it to `.github/workflows/` of a repository
# that has Roadbook charts. See docs/design/visualization.md, "Reviewing chart changes in pull
# requests". It is kept here, not in this repository's `.github/workflows/`, so that this
# repository's CI does not run it.

name: Chart changes

on:
  pull_request:
    paths:
      - "**/*.road"
      - "roadbook.toml"
      - "package.json"

permissions:
  contents: read
  pull-requests: write # to post the comment (forks and Dependabot get a read-only token anyway)

concurrency:
  group: chart-changes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request's head commit. By default a pull request checks out the merge
          # commit GitHub makes of it into the base, which is neither the head nor a commit
          # anyone pushed; with the head, `origin/<base>...HEAD` below is exactly what the pull
          # request changes since it forked, as GitHub's "Files changed" shows it.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # the base branch's history, which the diff reads with git

      # A chart that imports from an npm package (`import { … } from "@shop/inventory/…"`)
      # reads it from `node_modules`, which git does not hold: install the project's packages
      # when it has a `package.json`. Both sides of the diff read the packages installed here,
      # the pull request's. Install scripts are not run: the charts need only the files.
      - uses: actions/setup-node@v7
        if: hashFiles('package.json') != ''
        with:
          node-version: 22
      - name: Install the npm packages the charts import
        if: hashFiles('package.json') != ''
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile --ignore-scripts
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile --ignore-scripts # Yarn 1; Yarn 2+: --immutable --mode=skip-build
          elif [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi

      # Install the `roadbook` command. In the Roadbook repository itself this builds it from
      # source; elsewhere, install a released binary instead.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install roadbook
        run: cargo install --locked --path crates/roadbook-cli

      # `origin/<base>...HEAD`: what the pull request (HEAD, its head commit) changes since it
      # forked from the base, whatever has landed on the base since.
      - name: Draw the changes
        env:
          BASE: ${{ github.base_ref }}
        run: |
          roadbook viz --diff "origin/${BASE}...HEAD" -o roadbook-diff
          cat roadbook-diff/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the pages
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: roadbook-diff
          path: roadbook-diff
          retention-days: 14

      - name: Post or update the comment
        uses: actions/github-script@v9
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const fs = require('node:fs')
            const marker = '<!-- roadbook-diff -->'
            const summary = fs.readFileSync('roadbook-diff/summary.md', 'utf8')
            const body = [
              marker,
              summary,
              `[Download the pages](${process.env.ARTIFACT_URL}): a zip; unpack it and open \`index.html\`.`,
            ].join('\n')
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            try {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
              const mine = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker))
              if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body })
              else await github.rest.issues.createComment({ owner, repo, issue_number, body })
            } catch (e) {
              // A pull request from a fork, or from Dependabot, gets a read-only token: no
              // comment, and no failure. The summary is on the run's page and the pages are in
              // the artifact.
              if (e.status !== 403 && e.status !== 404) throw e
              core.notice(`No comment on the pull request: the token cannot write to it (${e.status}), as for a fork or Dependabot. The summary is on this run's page, and the pages are in the artifact roadbook-diff.`)
            }
