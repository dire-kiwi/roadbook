name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      # The tree-sitter grammar's check (editors/tree-sitter-roadbook/check.sh) needs the CLI, at the
      # exact version that generated the committed parser: other patch releases write a different src/.
      - run: npm install -g tree-sitter-cli@0.26.9
      - run: scripts/check-all.sh
