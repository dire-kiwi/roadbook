[workspace]
resolver = "3"
members = ["crates/*", "examples/inventory", "examples/orders", "examples/shop/axum"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse every float exactly, as JavaScript does, so canonical
# JSON matches the TypeScript runtime byte for byte.
serde_json = { version = "1", features = ["float_roundtrip", "unbounded_depth"] }
indexmap = { version = "2", features = ["serde"] }
ryu-js = "1"
sha2 = "0.10"
jsonschema = { version = "0.33", default-features = false }
insta = { version = "1", features = ["yaml"] }
clap = { version = "4.5", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
