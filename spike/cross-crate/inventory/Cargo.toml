[package]
name = "inventory"
version = "0.1.0"
edition = "2024"
publish = false
# Mechanism 2 only: `links` is what lets this build script's `cargo::metadata` reach the
# build scripts of direct dependents as DEP_ROADBOOK_INVENTORY_*.
links = "roadbook-inventory"
build = "build.rs"

[dependencies]
road-probe-macro = { version = "0.1", path = "../road-probe-macro" }
