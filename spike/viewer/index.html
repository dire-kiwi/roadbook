<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--@TITLE@--></title>
<style>
/*@CSS@*/
</style>
</head>
<body class="rb-app" data-initial-machine="<!--@INITIAL@-->">
<header class="rb-top">
  <div class="rb-brand">Roadbook<small id="rb-source"></small></div>
  <nav class="rb-tabs" id="rb-tabs" role="tablist" aria-label="Machines"></nav>
  <div class="rb-tools">
    <button class="rb-btn" id="rb-zoom-out" type="button" title="Zoom out" aria-label="Zoom out">−</button>
    <button class="rb-btn" id="rb-zoom-in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
    <button class="rb-btn" id="rb-fit" type="button" title="Fit the diagram to the view (F)">Fit</button>
    <button class="rb-btn" id="rb-theme" type="button" title="Colour scheme: follow the system, light or dark">Theme: auto</button>
  </div>
</header>
<div class="rb-machine-head">
  <button class="rb-btn rb-back" id="rb-back" type="button" hidden></button>
  <div id="rb-machine-head"></div>
</div>
<main class="rb-main">
  <div class="rb-stage">
    <div class="rb-canvas" id="rb-canvas">
      <div class="rb-hint">drag to pan · scroll to zoom · click a state or an arrow</div>
    </div>
    <div class="rb-legend" id="rb-legend" aria-label="Legend"></div>
  </div>
  <aside class="rb-panel" id="rb-panel" aria-live="polite"></aside>
</main>
<script type="application/json" id="rb-ir"><!--@IR@--></script>
<script>
/*@ELK@*/
</script>
<script>
/*@JS@*/
</script>
</body>
</html>
