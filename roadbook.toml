# The Roadbook project at the repository root, so that `roadbook check` here checks every
# chart and `roadbook gen --check` checks every generated module. Keys are documented under
# "Projects" in docs/design/language.md.

exclude = [
  # Charts that fail on purpose: each must give exactly its diagnostics.
  "crates/roadbook-compiler/tests/fail",
  "crates/roadbook/tests/ui/charts",
]

# Charts that are compiler, runtime or viewer fixtures, read as IR or by `roadbook::include!`,
# not through a generated TypeScript module.
gen-exclude = [
  "crates/roadbook-compiler/tests/pass",
  "crates/roadbook/tests/charts",
  "crates/roadbook/tests/crates",
  "packages/viewer/test/charts",
  "spec/conformance/charts",
]

# Runtime fixtures for the `unassigned` defect: their machines read a variable before it is
# assigned on purpose, so they are compiled without the definite assignment check (RB0403).
allow-unassigned = [
  "packages/effect/test/charts/runtime.road",
  "spec/conformance/charts/defects.road",
]

# Other packages a chart can import from, by name, and their directories. `examples/orders`
# imports `Inventory` from the package `inventory` as `"inventory/inventory.road"`.
[packages]
inventory = "examples/inventory"
# The fixture crates of `crates/roadbook/tests/include_crates.rs`.
chain0 = "crates/roadbook/tests/crates/chain0"
chain1 = "crates/roadbook/tests/crates/chain1"
errchain0 = "crates/roadbook/tests/crates/errchain0"
errchain1 = "crates/roadbook/tests/crates/errchain1"
hyphen-stock = "crates/roadbook/tests/crates/hyphen-stock"
left = "crates/roadbook/tests/crates/left"
nested-owner = "crates/roadbook/tests/crates/nested-owner"
right = "crates/roadbook/tests/crates/right"
