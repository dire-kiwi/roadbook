[package]
name = "roadbook"
description = "Roadbook statecharts in Rust: the include! macro, the driver, actors and traces"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = ["tokio"]
# The Tokio `Timer` and `spawn`.
tokio = ["dep:tokio"]

[dependencies]
roadbook-core = { path = "../roadbook-core" }
roadbook-ir = { path = "../roadbook-ir" }
roadbook-macros = { path = "../roadbook-macros" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", optional = true, features = ["rt", "time"] }

[dev-dependencies]
# The examples' crate that owns `inventory.road`, under another name, for `include_renamed.rs`.
inv = { package = "inventory", path = "../../examples/inventory" }
roadbook-compiler = { path = "../roadbook-compiler" }
roadbook-conformance = { path = "../roadbook-conformance" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }
trybuild = "1"

[lints]
workspace = true
