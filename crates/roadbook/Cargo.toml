[package]
name = "roadbook"
description = "Roadbook statecharts in Rust: the include! macro, the driver, actors and traces"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = ["tokio"]
# The Tokio `Timer` and `spawn`.
tokio = ["dep:tokio"]

[dependencies]
roadbook-core = { path = "../roadbook-core" }
roadbook-ir = { path = "../roadbook-ir" }
roadbook-macros = { path = "../roadbook-macros" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", optional = true, features = ["rt", "time"] }

[dev-dependencies]
# The examples' crate that owns `inventory.road`, under another name, for `include_renamed.rs`.
inv = { package = "inventory", path = "../../examples/inventory" }
# Fixture crates for `include_crates.rs` and `tests/ui/owner_in_module.rs`: a chain, a
# diamond, a chain whose error enums collide in the middle, a renamed dependency with a
# hyphen, and an owner that includes its chart in a module.
apex = { path = "tests/crates/apex" }
chain0 = { path = "tests/crates/chain0" }
chain1 = { path = "tests/crates/chain1" }
chain2 = { path = "tests/crates/chain2" }
errchain0 = { path = "tests/crates/errchain0" }
errchain1 = { path = "tests/crates/errchain1" }
errchain2 = { path = "tests/crates/errchain2" }
left = { path = "tests/crates/left" }
nested-owner = { path = "tests/crates/nested-owner" }
right = { path = "tests/crates/right" }
roadbook-compiler = { path = "../roadbook-compiler" }
roadbook-conformance = { path = "../roadbook-conformance" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }
trybuild = "1"

[lints]
workspace = true
