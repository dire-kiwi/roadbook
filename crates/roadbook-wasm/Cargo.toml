[package]
name = "roadbook-wasm"
description = "The Roadbook compiler as WebAssembly, for the npm package `@dire-kiwi/roadbook-cli`"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
roadbook-compiler = { path = "../roadbook-compiler" }
roadbook-gen-ts = { path = "../roadbook-gen-ts" }
roadbook-ir = { path = "../roadbook-ir" }
roadbook-syntax = { path = "../roadbook-syntax" }
serde.workspace = true
serde_json.workspace = true
# Pinned: the JavaScript glue in packages/cli/wasm is made by the `wasm-bindgen` command of
# the same version (`cargo install wasm-bindgen-cli --version 0.2.130`).
wasm-bindgen = "=0.2.130"

[lints]
workspace = true
