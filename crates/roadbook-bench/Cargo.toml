[package]
name = "roadbook-bench"
description = "Benchmarks of the Rust runtime on the example charts (shop, large, orders): the core alone, and whole runs through the driver and generated handlers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
# Only `benches/runtime.rs` takes criterion's options.
bench = false

[dependencies]
inventory = { path = "../../examples/inventory" }
orders = { path = "../../examples/orders" }
roadbook = { path = "../roadbook" }
roadbook-compiler = { path = "../roadbook-compiler" }
roadbook-core = { path = "../roadbook-core" }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "runtime"
harness = false

[lints]
workspace = true
